<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZARA LEGEND | المتجر الشامل</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c5a059; --dark: #000; --white: #fff; --red: #e74c3c;
            --main-size: 4em;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #f4f4f4; color: var(--dark); scroll-behavior: smooth; }

        /* --- 1. Loader (5 ثواني) --- */
        #loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center;
            z-index: 10000; transition: 0.8s;
        }
        .loader { 
            font-size: var(--main-size); color: white; font-weight: 900; 
            position: relative; width: 7.3em; height: 1.5em; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
        }
        .loader span { animation: scroll 5s infinite; text-transform: uppercase; }
        @keyframes scroll { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* --- 2. Header & Auth --- */
        header { 
            background: var(--dark); color: white; padding: 12px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; }
        .logo span { color: var(--gold); }
        
        .auth-btns { display: flex; gap: 8px; }
        .btn-auth { 
            padding: 6px 12px; border-radius: 5px; cursor: pointer; border: none; 
            font-weight: bold; font-size: 0.75rem; display: flex; align-items: center; gap: 5px; 
        }
        .google { background: white; color: black; }
        .facebook { background: #1877f2; color: white; }
        #user-profile { display: none; align-items: center; gap: 12px; }
        #user-photo { width: 35px; border-radius: 50%; border: 2px solid var(--gold); }

        /* --- 3. عروض الساعة --- */
        .flash-sale { 
            background: var(--red); color: white; text-align: center; 
            padding: 8px; font-weight: bold; display: flex; justify-content: center; 
            gap: 15px; align-items: center; font-size: 0.9rem;
        }
        #timer { background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 1.1rem; }

        /* --- 4. المتجر --- */
        .section-title { padding: 40px 5% 10px; font-size: 1.8rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; padding: 20px 5%; }
        .card { 
            background: white; padding: 15px; border-radius: 15px; position: relative; 
            transition: 0.3s; border: 1px solid #eee; overflow: hidden;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; }
        .offer-badge { position: absolute; top: 10px; left: 10px; background: var(--red); color: white; padding: 4px 10px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; }
        .card h3 { margin: 15px 0 5px; font-size: 1.2rem; }
        .price { font-size: 1.4rem; color: var(--gold); font-weight: 900; }
        .old-price { text-decoration: line-through; color: #aaa; font-size: 0.9rem; margin-right: 10px; }
        .btn-add { 
            background: var(--dark); color: white; border: none; width: 100%; 
            padding: 12px; margin-top: 15px; cursor: pointer; border-radius: 8px; font-weight: bold;
        }

        /* --- 5. سلة المشتريات --- */
        #cart-sidebar { 
            position: fixed; top: 0; left: -100%; width: 350px; height: 100%; 
            background: white; z-index: 5000; transition: 0.5s; padding: 25px; 
            display: flex; flex-direction: column; box-shadow: 5px 0 20px rgba(0,0,0,0.2);
        }
        #cart-sidebar.active { left: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f4f4f4; padding-bottom: 15px; }
        #cart-items-list { flex: 1; overflow-y: auto; padding: 20px 0; }
        .total-box { padding: 20px; border-top: 2px solid #f4f4f4; text-align: center; }
    </style>
</head>
<body>

    <div id="loader-wrapper"><div class="loader"><span>LOADING...</span></div></div>

    <div class="flash-sale">
        <span>⚡ ينتهي عرض الساعة خلال:</span>
        <div id="timer">05:00:00</div>
    </div>

    <header>
        <div class="logo">ZARA<span>.LEGEND</span></div>
        <div id="auth-container">
            <div class="auth-btns" id="auth-guest">
                <button class="btn-auth google" onclick="handleLogin('google')"><i class="fab fa-google"></i></button>
                <button class="btn-auth facebook" onclick="handleLogin('facebook')"><i class="fab fa-facebook"></i></button>
            </div>
            <div id="user-profile">
                <img id="user-photo" src="" alt="">
                <button onclick="handleLogout()" style="background:none; border:none; color:white; cursor:pointer; font-size:0.8rem;">خروج</button>
            </div>
        </div>
        <div onclick="toggleCart()" style="cursor:pointer; position:relative;">
            <i class="fa-solid fa-cart-shopping" style="font-size:1.4rem;"></i>
            <span id="cart-counter" style="position:absolute; top:-10px; right:-10px; background:var(--gold); color:white; font-size:0.7rem; padding:2px 6px; border-radius:50%;">0</span>
        </div>
    </header>

    <h2 class="section-title">عروض اليوم 🔥</h2>
    <div class="grid" id="main-grid"></div>

    <div id="cart-sidebar">
        <div class="cart-header">
            <h3>حقيبة المشتريات</h3>
            <i class="fa-solid fa-xmark" onclick="toggleCart()" style="cursor:pointer; font-size:1.5rem;"></i>
        </div>
        <div id="cart-items-list"></div>
        <div class="total-box">
            <h4>الإجمالي: <span id="grand-total">0</span> ج.م</h4>
            <button onclick="sendOrder()" style="background:#25d366; color:white; border:none; padding:15px; width:100%; border-radius:10px; margin-top:15px; cursor:pointer; font-weight:bold;">
                إرسال الطلب عبر واتساب <i class="fab fa-whatsapp"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, FacebookAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ ضع إعدادات مشروعك هنا
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore(app);

        let currentUser = null;
        let cart = [];

        // --- تسجيل الدخول ---
        window.handleLogin = (type) => {
            const provider = type === 'google' ? new GoogleAuthProvider() : new FacebookAuthProvider();
            signInWithPopup(auth, provider).catch(err => alert("عذراً، حدث خطأ في الدخول"));
        };

        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            const guestUI = document.getElementById('auth-guest');
            const profileUI = document.getElementById('user-profile');
            
            if (user) {
                currentUser = user;
                guestUI.style.display = 'none';
                profileUI.style.display = 'flex';
                document.getElementById('user-photo').src = user.photoURL;
                
                // جلب السلة المحفوظة
                const snap = await getDoc(doc(db, "carts", user.uid));
                if (snap.exists()) {
                    cart = snap.data().items;
                    updateCartUI();
                }
            } else {
                currentUser = null;
                guestUI.style.display = 'flex';
                profileUI.style.display = 'none';
                cart = [];
                updateCartUI();
            }
        });

        // --- المنتجات ---
        const products = [
            { id: 1, name: "خاتم فضة إيطالي", price: 400, oldPrice: 600, img: "https://images.unsplash.com/photo-1605100804763-247f67b3f413?w=400" },
            { id: 2, name: "سلسلة ذهبية ZARA", price: 950, oldPrice: 1200, img: "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?w=400" },
            { id: 3, name: "ساعة فاخرة", price: 1800, oldPrice: 2500, img: "https://images.unsplash.com/photo-1524592094713-9487ccad4c78?w=400" }
        ];

        window.addToCart = async (id) => {
            if (!currentUser) return alert("يرجى تسجيل الدخول أولاً لحفظ سلتك!");
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
            await setDoc(doc(db, "carts", currentUser.uid), { items: cart });
        };

        function updateCartUI() {
            document.getElementById('cart-counter').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            let total = 0;
            list.innerHTML = cart.map((item, idx) => {
                total += item.price;
                return `<div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <span>${item.name}</span> <b>${item.price} ج.م</b>
                </div>`;
            }).join('');
            document.getElementById('grand-total').innerText = total;
        }

        // رندر المنتجات
        const mainGrid = document.getElementById('main-grid');
        products.forEach(p => {
            mainGrid.innerHTML += `
                <div class="card">
                    <div class="offer-badge">خصم الساعة</div>
                    <img src="${p.img}">
                    <h3>${p.name}</h3>
                    <div class="price">${p.price} ج.م <span class="old-price">${p.oldPrice} ج.م</span></div>
                    <button class="btn-add" onclick="addToCart(${p.id})">أضف للحقيبة</button>
                </div>
            `;
        });

        // المؤقت
        let timeLeft = 3600 * 5;
        setInterval(() => {
            let h = Math.floor(timeLeft / 3600);
            let m = Math.floor((timeLeft % 3600) / 60);
            let s = timeLeft % 60;
            document.getElementById('timer').innerText = `${h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            timeLeft--;
        }, 1000);

        window.toggleCart = () => document.getElementById('cart-sidebar').classList.toggle('active');

        window.sendOrder = () => {
            let message = `طلب جديد من ${currentUser.displayName}:%0A`;
            cart.forEach(i => message += `- ${i.name} (${i.price} ج.م)%0A`);
            message += `%0Aالإجمالي: ${document.getElementById('grand-total').innerText} ج.م`;
            window.open(`https://wa.me/201234567890?text=${message}`);
        };

        // إخفاء اللودر
        setTimeout(() => {
            document.getElementById('loader-wrapper').style.opacity = '0';
            setTimeout(() => document.getElementById('loader-wrapper').style.display = 'none', 800);
        }, 5000);
    </script>
</body>
</html>
